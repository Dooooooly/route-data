<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>경로 데이터</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .route-item { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; }
        .from { color: #4A90D9; font-weight: bold; }
        .to { color: #e74c3c; font-weight: bold; }
        .info { font-size: 13px; color: #666; }
        h1 { color: #4A90D9; }
    </style>
</head>
<body>
    <h1>🚗 경로 데이터</h1>
    <div id="routeData">데이터를 불러오는 중...</div>

    <script>
        // URL에서 타임스탬프 파라미터 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const v = urlParams.get('v');
        
        // data.json 파일 로드 (캐시 방지)
        fetch(`data.json?v=${v}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('routeData');
                container.innerHTML = data.map(item => `
                    <div class="route-item">
                        <div>
                            <span class="from">${item.from}</span> 
                            → 
                            <span class="to">${item.to}</span>
                        </div>
                        <div class="info">
                            📏 ${item.km}km | ⏱️ ${item.min}분
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => {
                document.getElementById('routeData').innerHTML = 
                    '<p>⚠️ 데이터를 불러올 수 없습니다.</p>';
            });
    </script>
</body>
</html>
